name: Foundation checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redmars_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: redmars_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U redmars_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://redmars_test:test-only-password@localhost:5432/redmars_test
      JWT_SECRET: test-only-signing-key-not-for-production-12345
      SEED_ADMIN_PASSWORD: test-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma validate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api exec prisma migrate status
      - run: pnpm --filter api exec prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm --filter @redmars/shared build
      - run: pnpm --filter @redmars/shared test
      - run: pnpm --filter api exec prisma db seed
      - run: pnpm --filter api db:seed:icd
      - run: pnpm --filter api build
      - run: pnpm --filter web build
      - run: pnpm --filter api test --runInBand
      - run: pnpm --filter api test:e2e --runInBand
